name: Build and publish Daily News Shorts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -o Acquire::Retries=2
          sudo apt-get install -y ffmpeg
        timeout-minutes: 5

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
        timeout-minutes: 10

      - name: Validate and refresh YouTube OAuth before building
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials

          token_json = os.environ.get("YOUTUBE_TOKEN_JSON", "")
          if not token_json.strip():
              raise SystemExit("Missing GitHub Actions secret YOUTUBE_TOKEN_JSON.")

          token_path = Path("token.json")
          try:
              token_data = json.loads(token_json)
          except json.JSONDecodeError as exc:
              raise SystemExit("YOUTUBE_TOKEN_JSON is not valid JSON. Re-authorize YouTube and replace the secret.") from exc

          if not token_data.get("refresh_token"):
              raise SystemExit("YOUTUBE_TOKEN_JSON has no refresh_token. Re-authorize YouTube locally and replace the secret.")

          token_path.write_text(token_json, encoding="utf-8")
          credentials = Credentials.from_authorized_user_file(
              str(token_path),
              ["https://www.googleapis.com/auth/youtube.upload"],
          )
          try:
              credentials.refresh(Request())
          except Exception as exc:
              raise SystemExit(
                  "YouTube OAuth preflight failed before news/video generation. "
                  "The refresh token may be expired, revoked, or mismatched with the OAuth client. "
                  "Run python reauthorize_youtube.py locally, then update YOUTUBE_TOKEN_JSON. "
                  f"Google error type: {type(exc).__name__}"
              ) from exc

          if not credentials.valid:
              raise SystemExit("YouTube OAuth preflight did not produce valid credentials.")

          token_path.write_text(credentials.to_json(), encoding="utf-8")
          print("YouTube OAuth preflight passed; refreshed token saved for this run.")

      - name: Fetch latest news and validate images
        run: python fetch_news.py

      - name: Generate individual news posters
        run: python poster_generator.py

      - name: Generate combined video
        run: python make_video.py

      - name: Upload one combined video publicly
        run: python youtube_upload.py --privacy public

      - name: Upload build report and video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-news-short-published-build
          path: |
            output/posters/*.png
            output/daily_news_short.mp4
            output/review_report.md
            data/youtube_metadata.json
            data/image_rejection_log.json
          if-no-files-found: warn
          retention-days: 7
