name: Build and publish Daily News Shorts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -o Acquire::Retries=2
          sudo apt-get install -y ffmpeg
        timeout-minutes: 5

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
        timeout-minutes: 10

      - name: Fetch latest news and validate images
        run: python fetch_news.py

      - name: Generate individual news posters
        run: python poster_generator.py

      - name: Generate combined video
        run: python make_video.py

      - name: Require OAuth secret
        shell: bash
        run: |
          if [ -z "$YOUTUBE_TOKEN_JSON" ]; then
            echo "::error::Missing GitHub Actions secret YOUTUBE_TOKEN_JSON. Add a valid Google OAuth token.json JSON containing a refresh_token."
            exit 1
          fi

      - name: Write OAuth token securely
        shell: python
        run: |
          import os
          from pathlib import Path
          token = os.environ["YOUTUBE_TOKEN_JSON"]
          if not token.strip():
              raise SystemExit("YOUTUBE_TOKEN_JSON is empty.")
          Path("token.json").write_text(token, encoding="utf-8")

      - name: Upload one combined video publicly
        run: python youtube_upload.py --privacy public

      - name: Upload build report and video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-news-short-published-build
          path: |
            output/posters/*.png
            output/daily_news_short.mp4
            output/review_report.md
            data/youtube_metadata.json
          if-no-files-found: warn
          retention-days: 7
