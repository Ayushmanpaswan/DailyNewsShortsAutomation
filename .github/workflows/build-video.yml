name: Build Daily News Shorts (manual review)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -o Acquire::Retries=2
          sudo apt-get install -y ffmpeg
        timeout-minutes: 5

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
        timeout-minutes: 10

      - name: Fetch latest news
        run: python fetch_news.py

      - name: Generate poster
        run: python poster_generator.py

      - name: Generate video
        run: python make_video.py

      - name: Upload generated files for manual review
        uses: actions/upload-artifact@v4
        with:
          name: daily-news-short-review
          path: |
            output/posters/*.png
            output/daily_news_short.mp4
            output/review_report.md
            data/youtube_metadata.json
          if-no-files-found: error
          retention-days: 7
