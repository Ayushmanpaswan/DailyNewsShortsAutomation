
name: Build Daily News Short

on:
  workflow_dispatch:
  schedule:
    # Daily at 9:00 AM India time (03:30 UTC)
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Fetch latest news
        run: python fetch_news.py

      - name: Generate poster
        run: python poster_generator.py

      - name: Generate video
        run: python make_video.py

      - name: Save news history to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news_history.json
          if git diff --cached --quiet; then
            echo "News history has no changes to commit."
          else
            git commit -m "Update daily news history [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: daily-news-short
          path: |
            output/daily_news_poster.png
            output/daily_news_short.mp4
          if-no-files-found: error
          retention-days: 7
