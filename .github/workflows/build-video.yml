name: Build Daily News Shorts

on:
  workflow_dispatch:
  schedule:
    # Daily at 5:00 AM IST (23:30 UTC, previous day)
    - cron: "30 23 * * *"

    # Daily at 9:00 AM IST (03:30 UTC)
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Step 1: Download project files
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Install FFmpeg
      - name: Install FFmpeg
        run: |
          sudo apt-get update -o Acquire::Retries=2
          sudo apt-get install -y ffmpeg
        timeout-minutes: 5

      # Step 4: Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
        timeout-minutes: 10

      # Step 5: Prepare YouTube credentials
      - name: Prepare YouTube credentials
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          test -n "$YOUTUBE_CLIENT_SECRET_JSON" || {
            echo "Missing YOUTUBE_CLIENT_SECRET_JSON secret"
            exit 1
          }

          test -n "$YOUTUBE_TOKEN_JSON" || {
            echo "Missing YOUTUBE_TOKEN_JSON secret"
            exit 1
          }

          printf '%s' "$YOUTUBE_CLIENT_SECRET_JSON" > client_secret.json
          printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json

          chmod 600 client_secret.json token.json

      # Step 6: Fetch latest news
      - name: Fetch latest news
        run: python fetch_news.py

      # Step 7: Generate news poster
      - name: Generate poster
        run: python poster_generator.py

      # Step 8: Generate video
      - name: Generate video
        run: python make_video.py

      # Step 9: Upload video to YouTube
      - name: Upload Short to YouTube
        run: python youtube_upload.py --privacy public

      # Step 10: Save news history
      - name: Save news history to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/news_history.json

          if git diff --cached --quiet; then
            echo "News history has no changes to commit."
          else
            git commit -m "Update daily news history [skip ci]"
            git push origin HEAD:main
          fi

      # Step 11: Save generated files as artifacts
      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: daily-news-short
          path: |
            output/daily_news_poster.png
            output/daily_news_short.mp4
          if-no-files-found: error
          retention-days: 7

      # Step 12: Clean up credentials
      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f client_secret.json token.json
